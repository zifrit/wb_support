services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "cd /app/backend &&
      alembic upgrade head &&
      uvicorn backend.app.main:app --app-dir /app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
#      clickhouse:
#        condition: service_started
      token-validator-mock:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-wb_wrapper}
      POSTGRES_USER: ${DB_USER:-wb}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    ports:
#      - "8123:8123"
#      - "9001:9000"
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse

  token-validator-mock:
    build:
      context: ./infra/token-validator-mock
    ports:
      - "9000:9000"

volumes:
  postgres_data:
#  clickhouse_data:

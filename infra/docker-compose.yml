services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
    command: >
      sh -c "cd /app/backend &&
      alembic upgrade head &&
      uvicorn backend.app.main:app --app-dir /app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - postgres
      - clickhouse
      - token-validator-mock

  frontend:
    build:
      context: ../frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wb_wrapper
      POSTGRES_USER: wb
      POSTGRES_PASSWORD: wb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  token-validator-mock:
    build:
      context: ./token-validator-mock
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  clickhouse_data:

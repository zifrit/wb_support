version: '3.9'

services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - clickhouse
      - token-validator-mock

  frontend:
    build:
      context: ../frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wb_wrapper
      POSTGRES_USER: wb
      POSTGRES_PASSWORD: wb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  token-validator-mock:
    build:
      context: ./token-validator-mock
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  clickhouse_data:

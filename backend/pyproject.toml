[project]
name = "wb-wrapper-backend"
version = "0.1.0"
description = "WB API wrapper backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "greenlet>=3.1.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "anyio>=4.4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
